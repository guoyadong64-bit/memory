[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smp-memory-agent"
version = "0.1.0"
description = "Evidence-based agent memory with SQLite hypergraph storage and Jev judgment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8.0,<3",
  "httpx>=0.27.0,<1",
  "python-dotenv>=1.0.0,<2",
  "pytest>=7.4.0,<10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
